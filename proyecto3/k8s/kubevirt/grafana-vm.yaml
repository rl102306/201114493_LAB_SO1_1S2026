---
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: grafana-vm
  namespace: mumk8s
  labels:
    app: grafana-vm
spec:
  runStrategy: Always
  template:
    metadata:
      labels:
        app: grafana-vm
        kubevirt.io/vm: grafana-vm
    spec:
      domain:
        cpu:
          cores: 1
        memory:
          guest: 2Gi
        devices:
          disks:
            - name: containerdisk
              disk:
                bus: virtio
            - name: cloudinit
              disk:
                bus: virtio
          interfaces:
            - name: default
              masquerade: {}
      networks:
        - name: default
          pod: {}
      volumes:
        - name: containerdisk
          containerDisk:
            image: 34.172.8.2:5000/mumk8s/ubuntu-containerdisk:22.04
        - name: cloudinit
          cloudInitNoCloud:
            userData: |
              #cloud-config
              package_update: true
              package_upgrade: false
              chpasswd:
                list: |
                  ubuntu:ubuntu123
                expire: false
              packages:
                - apt-transport-https
                - software-properties-common
                - wget
              runcmd:
                - wget -q https://dl.grafana.com/oss/release/grafana_11.0.0_amd64.deb -O /tmp/grafana.deb
                - dpkg -i /tmp/grafana.deb
                - mkdir -p /etc/grafana/provisioning/datasources
                - |
                  cat > /etc/grafana/provisioning/datasources/valkey.yaml << 'EOF'
                  apiVersion: 1
                  datasources:
                  - name: Valkey
                    type: redis-datasource
                    url: redis://valkey-vm-svc.mumk8s.svc.cluster.local:6379
                    access: proxy
                    isDefault: true
                  EOF
                - grafana cli --pluginsDir /var/lib/grafana/plugins plugins install redis-datasource
                - sed -i 's/;allow_loading_unsigned_plugins =/allow_loading_unsigned_plugins = redis-datasource/' /etc/grafana/grafana.ini
                - sed -i 's/;http_addr =/http_addr = 0.0.0.0/' /etc/grafana/grafana.ini
                - systemctl enable grafana-server
                - systemctl start grafana-server
---
apiVersion: v1
kind: Service
metadata:
  name: grafana-vm-svc
  namespace: mumk8s
  labels:
    app: grafana-vm
spec:
  selector:
    kubevirt.io/vm: grafana-vm
  ports:
    - name: grafana
      protocol: TCP
      port: 3000
      targetPort: 3000
  type: LoadBalancer
