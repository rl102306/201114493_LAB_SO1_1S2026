# KubeVirt VM — Valkey (Redis-compatible key-value store)
# Requires KubeVirt installed in the cluster.
# Uses Fedora Cloud container disk + cloud-init to install valkey.
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: valkey-vm
  namespace: mumk8s
  labels:
    app: valkey-vm
spec:
  runStrategy: Always
  template:
    metadata:
      labels:
        app: valkey-vm
        kubevirt.io/vm: valkey-vm
    spec:
      domain:
        cpu:
          cores: 1
        memory:
          guest: 1Gi
        devices:
          disks:
            - name: containerdisk
              disk:
                bus: virtio
            - name: cloudinit
              disk:
                bus: virtio
          interfaces:
            - name: default
              masquerade: {}
      networks:
        - name: default
          pod: {}
      volumes:
        - name: containerdisk
          containerDisk:
            image: 34.172.8.2:5000/mumk8s/ubuntu-containerdisk:22.04
        - name: cloudinit
          cloudInitNoCloud:
            userData: |
              #cloud-config
              package_update: true
              package_upgrade: false
              chpasswd:
                list: |
                  ubuntu:ubuntu123
                expire: false
              packages:
                - redis-server
              runcmd:
                - sed -i 's/^bind .*/bind 0.0.0.0/' /etc/redis/redis.conf
                - sed -i 's/^# save/save/' /etc/redis/redis.conf
                - systemctl enable redis-server
                - systemctl restart redis-server
---
# Service to expose Valkey VM inside the cluster
apiVersion: v1
kind: Service
metadata:
  name: valkey-vm-svc
  namespace: mumk8s
  labels:
    app: valkey-vm
spec:
  selector:
    kubevirt.io/vm: valkey-vm
  ports:
    - name: valkey
      protocol: TCP
      port: 6379
      targetPort: 6379
  type: ClusterIP
