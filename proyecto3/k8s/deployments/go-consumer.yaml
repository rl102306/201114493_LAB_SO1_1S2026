apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-consumer
  namespace: mumk8s
  labels:
    app: go-consumer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: go-consumer
  template:
    metadata:
      labels:
        app: go-consumer
    spec:
      containers:
        - name: go-consumer
          image: ${ZOT_HOST}/mumk8s/go-consumer:latest
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: mumk8s-config
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
