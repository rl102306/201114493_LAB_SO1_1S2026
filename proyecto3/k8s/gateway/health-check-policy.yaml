apiVersion: networking.gke.io/v1
kind: HealthCheckPolicy
metadata:
  name: rust-api-health
  namespace: mumk8s
spec:
  default:
    checkIntervalSec: 15
    timeoutSec: 15
    healthyThreshold: 1
    unhealthyThreshold: 2
    config:
      type: TCP
      tcpHealthCheck:
        port: 8080
  targetRef:
    group: ""
    kind: Service
    name: rust-api-svc
